<!-- @dsCard group="Fundações" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; background:#121212; font-family:Inter,system-ui,sans-serif; color:#f3f4f6; padding:24px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.12em; color:#adaaaa; margin:20px 0 10px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { width:108px; border-radius:12px; overflow:hidden; border:1px solid rgba(72,72,71,.4); }
  .sw .c { height:64px; }
  .sw .l { padding:8px 10px; background:#1a1a1a; }
  .sw .n { font-size:11px; font-weight:700; display:block; }
  .sw .h { font-size:10px; color:#adaaaa; }
</style>
</head>
<body>
  <h2>Superfícies</h2>
  <div class="row">
    <div class="sw"><div class="c" style="background:#121212"></div><div class="l"><span class="n">background</span><span class="h">#121212</span></div></div>
    <div class="sw"><div class="c" style="background:#1a1a1a"></div><div class="l"><span class="n">surface</span><span class="h">#1a1a1a</span></div></div>
    <div class="sw"><div class="c" style="background:#20201f"></div><div class="l"><span class="n">surface-raised</span><span class="h">#20201f</span></div></div>
    <div class="sw"><div class="c" style="background:#484847"></div><div class="l"><span class="n">border</span><span class="h">#484847</span></div></div>
  </div>
  <h2>Texto</h2>
  <div class="row">
    <div class="sw"><div class="c" style="background:#f3f4f6"></div><div class="l"><span class="n">foreground</span><span class="h">#f3f4f6</span></div></div>
    <div class="sw"><div class="c" style="background:#adaaaa"></div><div class="l"><span class="n">muted</span><span class="h">#adaaaa</span></div></div>
  </div>
  <h2>Marca</h2>
  <div class="row">
    <div class="sw"><div class="c" style="background:#06b6d4"></div><div class="l"><span class="n">primary</span><span class="h">#06b6d4</span></div></div>
    <div class="sw"><div class="c" style="background:#53ddfc"></div><div class="l"><span class="n">primary-bright</span><span class="h">#53ddfc</span></div></div>
    <div class="sw"><div class="c" style="background:#004b58"></div><div class="l"><span class="n">primary-deep</span><span class="h">#004b58</span></div></div>
  </div>
  <h2>Feedback</h2>
  <div class="row">
    <div class="sw"><div class="c" style="background:#ff716c"></div><div class="l"><span class="n">danger</span><span class="h">#ff716c</span></div></div>
    <div class="sw"><div class="c" style="background:#ffcc00"></div><div class="l"><span class="n">warning</span><span class="h">#ffcc00</span></div></div>
    <div class="sw"><div class="c" style="background:#22c55e"></div><div class="l"><span class="n">success</span><span class="h">#22c55e</span></div></div>
  </div>
</body>
</html>
