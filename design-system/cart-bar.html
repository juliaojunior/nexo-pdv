<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; background:#121212; font-family:Inter,system-ui,sans-serif; color:#f3f4f6; padding:32px 16px; }
  .bar { max-width:420px; margin:0 auto; background:rgba(26,26,26,.95); border:1px solid rgba(6,182,212,.3); border-radius:16px; height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; box-shadow:0 -8px 32px rgba(0,0,0,.5); }
  .label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:#adaaaa; display:block; margin-bottom:4px; }
  .total { font-size:18px; font-weight:800; letter-spacing:-.01em; }
  .cta { background:#06b6d4; color:#004b58; font-weight:900; font-size:14px; text-transform:uppercase; letter-spacing:.03em; padding:10px 24px; border-radius:12px; }
</style>
</head>
<body>
  <div class="bar">
    <div><span class="label">Carrinho (3)</span><span class="total">R$ 42,40</span></div>
    <div class="cta">Finalizar</div>
  </div>
</body>
</html>
